<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña | BPSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="reset">
  <main class="reset-wrap">
    <div class="reset-card">
      <a class="back-link" href="login.html">← Volver a login</a>
      <span class="eyebrow">Recuperación</span>
      <h1>Restablecer contraseña</h1>

      <div id="step-link">
        <p>Para continuar, valida primero el enlace seguro enviado a tu correo electrónico.</p>
        <button id="continue-btn" class="btn btn-primary" type="button">Continuar recuperación</button>
      </div>

      <div id="step-form" class="hidden">
        <p>Ingresa tu nueva contraseña para finalizar el proceso.</p>

        <form id="reset-form" class="stack-form">
          <label for="password">
            <span>Nueva contraseña</span>
            <input id="password" type="password" required minlength="8" />
          </label>

          <label for="confirmPassword">
            <span>Confirmar contraseña</span>
            <input id="confirmPassword" type="password" required minlength="8" />
          </label>

          <button class="btn btn-primary" type="submit">Guardar nueva contraseña</button>
        </form>
      </div>

      <div id="msg" class="alert hidden"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://wedhcjlrlwdjoneahodl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QvlFvKMlHZsL1tP_UZfSvw_a4A6ejrQ';
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    const msg = document.getElementById('msg');
    const resetForm = document.getElementById('reset-form');
    const stepLink = document.getElementById('step-link');
    const stepForm = document.getElementById('step-form');
    const continueBtn = document.getElementById('continue-btn');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `alert ${type}`;
      msg.classList.remove('hidden');
    }

    function hasRecoverySessionInHash() {
      const hash = window.location.hash || '';
      return hash.includes('access_token=') && hash.includes('type=recovery');
    }

    function getConfirmationUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('confirmation_url');
    }

    async function initPage() {
      const confirmationUrl = getConfirmationUrl();

      if (hasRecoverySessionInHash()) {
        stepLink.classList.add('hidden');
        stepForm.classList.remove('hidden');
        showMessage('Enlace validado correctamente. Ya puedes ingresar tu nueva contraseña.', 'success');
        return;
      }

      if (confirmationUrl) {
        stepLink.classList.remove('hidden');
        stepForm.classList.add('hidden');
        continueBtn.addEventListener('click', () => {
          window.location.href = confirmationUrl;
        });
        showMessage('Haz clic en “Continuar recuperación” para validar el enlace seguro.', 'success');
        return;
      }

      stepLink.classList.add('hidden');
      stepForm.classList.add('hidden');
      showMessage('No se encontró un enlace de recuperación válido. Solicita un nuevo correo de restablecimiento.', 'error');
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage('Las contraseñas no coinciden.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('La contraseña debe tener al menos 8 caracteres.', 'error');
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        showMessage(`Error al cambiar contraseña: ${error.message}`, 'error');
        return;
      }

      showMessage('Contraseña actualizada correctamente. Ya puedes volver a iniciar sesión.', 'success');
      resetForm.reset();
    });

    initPage();
  </script>
</body>
</html>
