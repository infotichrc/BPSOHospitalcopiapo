<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña - BPSO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Inter, Arial, sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(12px);
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    p {
      color: #cbd5e1;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: white;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #4cc9f0, #72efdd);
      color: #05111f;
    }
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
      white-space: pre-wrap;
    }
    .msg.show { display: block; }
    .msg.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fecaca;
    }
    .msg.success {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.35);
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Restablecer contraseña</h1>
    <p>Ingresa tu nueva contraseña para finalizar la recuperación.</p>

    <form id="reset-form">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" required minlength="8" />

      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" required minlength="8" />

      <button type="submit">Guardar nueva contraseña</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wedhcjlrlwdjoneahodl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QvlFvKMlHZsL1tP_UZfSvw_a4A6ejrQ';
    const { createClient } = window.supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `msg show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage('Las contraseñas no coinciden.', 'error');
        return;
      }

      if (password.length < 8) {
        showMessage('La contraseña debe tener al menos 8 caracteres.', 'error');
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({
        password
      });

      if (error) {
        showMessage(`Error al cambiar contraseña: ${error.message}`, 'error');
        return;
      }

      showMessage('Contraseña actualizada correctamente. Ya puedes volver a iniciar sesión.', 'success');
      form.reset();
    });
  </script>
</body>
</html>
